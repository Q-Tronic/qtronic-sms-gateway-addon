name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install
          aioesphomeapi==44.13.3
          "aiomqtt>=2,<3"
          "fastapi>=0.115,<1"
          "homeassistant==2026.8.0"
          "uvicorn>=0.30,<1"
          pytest pytest-asyncio pyyaml ruff voluptuous
      - name: Ruff
        run: ruff check qtronic_sms_gateway/app qtronic_sms_gateway/ha_custom_components tests
      - name: Compile Python
        run: python -m compileall -q qtronic_sms_gateway/app qtronic_sms_gateway/ha_custom_components
      - name: Tests
        run: python -m pytest -q tests
      - name: Validate JSON and YAML
        shell: python
        run: |
          import json
          from pathlib import Path

          import yaml

          for path in Path("qtronic_sms_gateway").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in Path("qtronic_sms_gateway").rglob("*.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))

  addon-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build amd64 add-on image
        run: |
          version="$(awk '/^version:/{print $2; exit}' qtronic_sms_gateway/config.yaml)"
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION="$version" \
            qtronic_sms_gateway
