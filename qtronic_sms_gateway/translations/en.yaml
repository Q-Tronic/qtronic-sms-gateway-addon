configuration:
  esphome:
    name: ESPHome connection
    description: Configure the ESPHome node used as the GSM modem gateway.
    fields:
      host:
        name: ESPHome host
        description: IP address or hostname of the ESPHome node.
      port:
        name: ESPHome API port
        description: Native ESPHome API port.
      encryption_key:
        name: ESPHome encryption key
        description: Native API encryption key from the ESPHome YAML.
      send_sms_action:
        name: SMS action
        description: ESPHome action name for sending GSM text messages.
      unicode_send_sms_action:
        name: Unicode SMS action
        description: ESPHome action name for UCS2 SMS messages.
      dial_action:
        name: Dial action
        description: ESPHome action name for starting an outbound call.
      disconnect_action:
        name: Disconnect action
        description: ESPHome action name for hanging up a call.
      send_ussd_action:
        name: USSD action
        description: ESPHome action name used to send USSD codes.
      rssi_object_id:
        name: RSSI object ID
        description: Object ID used to detect the RSSI sensor.
      registered_object_id:
        name: Registered object ID
        description: Object ID used to detect network registration.
      modem_online_object_id:
        name: Modem Online object ID
        description: Object ID of the watchdog confirming SIM800C responses.
      sms_sender_object_id:
        name: SMS sender object ID
        description: Object ID used to detect the SMS sender text sensor.
      sms_message_object_id:
        name: SMS message object ID
        description: Object ID used to detect the SMS message text sensor.
      incoming_call_object_id:
        name: Incoming call object ID
        description: Object ID used to detect incoming call caller ID.
      call_state_object_id:
        name: Call state object ID
        description: Object ID used to detect current call state.
      ussd_object_id:
        name: USSD object ID
        description: Object ID used to detect USSD messages.
      sms_status_object_id:
        name: SMS status object ID
        description: Object ID reporting queued, sent, failed, or unknown SMS results.
      sms_last_error_object_id:
        name: SMS last error object ID
        description: Object ID containing the latest SMS transport error.
      sms_queue_depth_object_id:
        name: SMS queue depth object ID
        description: Object ID reporting queued and active SMS messages.
      sms_sent_count_object_id:
        name: SMS sent count object ID
        description: Object ID counting messages confirmed by the modem.
      sms_failed_count_object_id:
        name: SMS failed count object ID
        description: Object ID counting definitively failed SMS submissions.
      sms_unknown_count_object_id:
        name: SMS unknown count object ID
        description: Object ID counting submissions with an ambiguous final result.
      sim800_timeout_count_object_id:
        name: SIM800 timeout count object ID
        description: Object ID counting modem command timeouts.
      sim800_recovery_count_object_id:
        name: SIM800 recovery count object ID
        description: Object ID counting controlled modem state-machine recoveries.
      uart_rx_overflow_count_object_id:
        name: UART RX error count object ID
        description: Object ID counting UART receive overflows and read errors.
      sim800_last_response_age_object_id:
        name: SIM800 response age object ID
        description: Object ID reporting seconds since the last valid modem response.
      sim800_state_object_id:
        name: SIM800 state object ID
        description: Object ID reporting the current modem transport state.
  sms:
    name: SMS settings
    description: Configure outgoing SMS behavior.
    fields:
      default_encoding:
        name: Default SMS encoding
        description: Preferred encoding mode for outgoing SMS.
      send_delay_ms:
        name: Delay between SMS messages [ms]
        description: Delay used when sending multiple SMS messages in one batch.
      max_segments:
        name: Maximum segment count
        description: Maximum number of message parts accepted before rejecting an outgoing message.
      retries:
        name: SMS retries
        description: Number of retries after an unambiguous modem failure.
      retry_backoff_s:
        name: SMS retry delay [s]
        description: Delay before another attempt to send a message.
      split_long:
        name: Split long messages
        description: Allow messages longer than one GSM-7 or UCS2 segment to be split.
      confirmation_timeout_s:
        name: Modem confirmation timeout [s]
        description: Maximum wait for the final SIM800C send result; the 75 s minimum covers the firmware deadline.
  calling:
    name: Call settings
    description: Configure outbound call behavior and retry policy.
    fields:
      default_ring_time_s:
        name: Default ring time [s]
        description: Maximum duration of a single call attempt.
      delay_between_calls_s:
        name: Delay between calls [s]
        description: Wait time before the next recipient is dialed.
      max_retries:
        name: Retries per recipient
        description: Number of retries before moving on or stopping.
      retry_delay_s:
        name: Delay between retries [s]
        description: Pause before retrying the same recipient.
      retry_forever:
        name: Retry forever
        description: Keep retrying the same recipient until a call connects.
      failure_action:
        name: Failure action
        description: What to do after retries are exhausted.
  mqtt:
    name: MQTT
    description: Publish states/events and receive commands through MQTT.
    fields:
      enabled:
        name: Enable MQTT
        description: Enable the MQTT bridge.
      host:
        name: MQTT host
        description: Hostname of the MQTT broker.
      port:
        name: MQTT port
        description: Port of the MQTT broker.
      username:
        name: MQTT username
        description: Optional username for MQTT authentication.
      password:
        name: MQTT password
        description: Optional password for MQTT authentication.
      topic_prefix:
        name: Topic prefix
        description: Base topic used for Q-Tronic MQTT topics.
      discovery_enabled:
        name: Enable Home Assistant discovery
        description: Publish MQTT discovery payloads for Q-Tronic sensors.
      discovery_prefix:
        name: Discovery prefix
        description: Home Assistant MQTT discovery prefix.
  security:
    name: API security
    description: Configure gateway authentication and request rate limiting.
    fields:
      require_auth:
        name: Require API authentication
        description: Require the automatically generated Bearer token outside trusted Ingress.
      allow_ingress:
        name: Allow Ingress
        description: Allow the authenticated Home Assistant proxy to access the dashboard and API.
      rate_limit_requests:
        name: Request limit
        description: Maximum number of requests from one client in the configured time window.
      rate_limit_window_s:
        name: Rate-limit window [s]
        description: Window length used for request rate limiting.
  history:
    name: History and audit
    description: Configure persistent history for SMS, calls, commands, and failures.
    fields:
      enabled:
        name: Enable history
        description: Store events in the add-on persistent database.
      retention_days:
        name: Retention [days]
        description: Automatically remove entries older than this number of days.
      max_entries:
        name: Maximum entries
        description: Upper limit for retained audit events.
      privacy:
        name: Privacy level
        description: Store full data, masked data, or metadata only.
  recipients:
    name: Saved recipients
    description: Define named recipients for SMS and call commands.
    fields:
      id:
        name: Recipient ID
        description: Optional stable identifier used by REST and MQTT.
      name:
        name: Recipient name
        description: Display name of the recipient.
      phone:
        name: Phone number
        description: International phone number.
network:
  8099/TCP: Q-Tronic SMS Gateway web UI and REST API
