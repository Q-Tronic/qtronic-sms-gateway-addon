configuration:
  esphome:
    name: Połączenie z ESPHome
    description: Skonfiguruj węzeł ESPHome używany jako bramka modemu GSM.
    fields:
      host:
        name: Host ESPHome
        description: Adres IP lub hostname węzła ESPHome.
      port:
        name: Port API ESPHome
        description: Port natywnego API ESPHome.
      encryption_key:
        name: Klucz szyfrowania ESPHome
        description: Klucz szyfrowania Native API z YAML ESPHome.
      send_sms_action:
        name: Akcja SMS
        description: Nazwa akcji ESPHome do wysyłki SMS.
      unicode_send_sms_action:
        name: Akcja SMS Unicode
        description: Nazwa akcji ESPHome do wysyłki SMS UCS2.
      dial_action:
        name: Akcja wybierania
        description: Nazwa akcji ESPHome do rozpoczęcia połączenia.
      disconnect_action:
        name: Akcja rozłączenia
        description: Nazwa akcji ESPHome do rozłączenia połączenia.
      send_ussd_action:
        name: Akcja USSD
        description: Nazwa akcji ESPHome do wysyłania kodów USSD.
      rssi_object_id:
        name: Object ID RSSI
        description: Object ID używany do wykrywania sensora RSSI.
      registered_object_id:
        name: Object ID Registered
        description: Object ID używany do wykrywania rejestracji w sieci.
      modem_online_object_id:
        name: Object ID Modem Online
        description: Object ID watchdoga potwierdzającego odpowiedzi modemu SIM800C.
      sms_sender_object_id:
        name: Object ID nadawcy SMS
        description: Object ID używany do wykrywania nadawcy SMS.
      sms_message_object_id:
        name: Object ID treści SMS
        description: Object ID używany do wykrywania treści SMS.
      incoming_call_object_id:
        name: Object ID połączenia przychodzącego
        description: Object ID używany do wykrywania numeru połączenia przychodzącego.
      call_state_object_id:
        name: Object ID stanu połączenia
        description: Object ID używany do wykrywania stanu połączenia.
      ussd_object_id:
        name: Object ID USSD
        description: Object ID używany do wykrywania wiadomości USSD.
      sms_status_object_id:
        name: Object ID statusu SMS
        description: Object ID wyniku kolejki SMS, np. queued, sent, failed lub unknown.
      sms_last_error_object_id:
        name: Object ID ostatniego błędu SMS
        description: Object ID tekstu z ostatnim błędem transportu SMS.
      sms_queue_depth_object_id:
        name: Object ID długości kolejki SMS
        description: Object ID liczby wiadomości oczekujących lub wysyłanych.
      sms_sent_count_object_id:
        name: Object ID wysłanych SMS-ów
        description: Object ID licznika SMS-ów potwierdzonych przez modem.
      sms_failed_count_object_id:
        name: Object ID błędnych SMS-ów
        description: Object ID licznika jednoznacznie nieudanych wysyłek SMS.
      sms_unknown_count_object_id:
        name: Object ID SMS-ów o nieznanym wyniku
        description: Object ID licznika wysyłek bez jednoznacznego wyniku po przekazaniu treści modemowi.
      sim800_timeout_count_object_id:
        name: Object ID timeoutów SIM800
        description: Object ID licznika przekroczeń czasu odpowiedzi komend modemu.
      sim800_recovery_count_object_id:
        name: Object ID odzyskiwania SIM800
        description: Object ID licznika kontrolowanych prób odzyskania maszyny stanów modemu.
      uart_rx_overflow_count_object_id:
        name: Object ID błędów UART RX
        description: Object ID licznika przepełnień i błędów odbioru UART.
      sim800_last_response_age_object_id:
        name: Object ID wieku odpowiedzi SIM800
        description: Object ID czasu od ostatniej poprawnej odpowiedzi modemu w sekundach.
      sim800_state_object_id:
        name: Object ID stanu SIM800
        description: Object ID bieżącego stanu wewnętrznej maszyny transportu modemu.
  sms:
    name: Ustawienia SMS
    description: Skonfiguruj sposób wysyłki wiadomości SMS.
    fields:
      default_encoding:
        name: Domyślne kodowanie SMS
        description: Preferowany tryb kodowania dla SMS.
      send_delay_ms:
        name: Odstęp między SMS-ami [ms]
        description: Opóźnienie przy wysyłce wielu SMS-ów w jednym batchu.
      max_segments:
        name: Maksymalna liczba segmentów
        description: Maksymalna liczba części jednej wiadomości przed jej odrzuceniem.
      retries:
        name: Ponowienia wysyłki SMS
        description: Ile razy ponowić wysyłkę po jednoznacznym błędzie modemu.
      retry_backoff_s:
        name: Odstęp ponowień SMS [s]
        description: Czas oczekiwania przed kolejną próbą wysłania wiadomości.
      split_long:
        name: Dziel długie wiadomości
        description: Zezwól na podział wiadomości przekraczającej pojedynczy segment GSM-7 lub UCS2.
      confirmation_timeout_s:
        name: Timeout potwierdzenia modemu [s]
        description: Maksymalny czas oczekiwania na końcowy wynik wysyłki z SIM800C; minimum 75 s odpowiada deadline firmware.
  calling:
    name: Ustawienia połączeń
    description: Skonfiguruj połączenia wychodzące i politykę ponowień.
    fields:
      default_ring_time_s:
        name: Domyślny czas dzwonienia [s]
        description: Maksymalny czas pojedynczej próby połączenia.
      delay_between_calls_s:
        name: Odstęp między połączeniami [s]
        description: Czas oczekiwania przed wybraniem kolejnego odbiorcy.
      max_retries:
        name: Liczba ponowień na odbiorcę
        description: Ile razy ponawiać połączenie przed przejściem dalej lub zatrzymaniem.
      retry_delay_s:
        name: Odstęp między ponowieniami [s]
        description: Pauza przed kolejną próbą do tego samego odbiorcy.
      retry_forever:
        name: Dzwoń do skutku
        description: Ponawiaj połączenie aż do skutecznego połączenia.
      failure_action:
        name: Akcja po niepowodzeniu
        description: Co zrobić po wyczerpaniu ponowień.
  mqtt:
    name: MQTT
    description: Publikuj stany i zdarzenia oraz odbieraj komendy przez MQTT.
    fields:
      enabled:
        name: Włącz MQTT
        description: Włącza most MQTT.
      host:
        name: Host MQTT
        description: Hostname brokera MQTT.
      port:
        name: Port MQTT
        description: Port brokera MQTT.
      username:
        name: Użytkownik MQTT
        description: Opcjonalna nazwa użytkownika do uwierzytelniania MQTT.
      password:
        name: Hasło MQTT
        description: Opcjonalne hasło do uwierzytelniania MQTT.
      topic_prefix:
        name: Prefiks topiców
        description: Bazowy prefiks topiców Q-Tronic MQTT.
      discovery_enabled:
        name: Włącz discovery Home Assistant
        description: Publikuj payloady discovery MQTT dla sensorów Q-Tronic.
      discovery_prefix:
        name: Prefiks discovery
        description: Prefiks discovery MQTT dla Home Assistant.
  security:
    name: Bezpieczeństwo API
    description: Skonfiguruj uwierzytelnianie i ograniczenie liczby żądań do bramki.
    fields:
      require_auth:
        name: Wymagaj autoryzacji API
        description: Wymagaj automatycznie wygenerowanego tokenu Bearer poza zaufanym Ingress.
      allow_ingress:
        name: Zezwól na Ingress
        description: Zezwól uwierzytelnionemu proxy Home Assistant na dostęp do dashboardu i API.
      rate_limit_requests:
        name: Limit żądań
        description: Maksymalna liczba żądań jednego klienta w skonfigurowanym oknie czasu.
      rate_limit_window_s:
        name: Okno limitu [s]
        description: Długość okna używanego do ograniczania liczby żądań.
  history:
    name: Historia i audyt
    description: Skonfiguruj trwałą historię operacji SMS, połączeń, poleceń i błędów.
    fields:
      enabled:
        name: Włącz historię
        description: Zapisuj zdarzenia w trwałej bazie dodatku.
      retention_days:
        name: Retencja [dni]
        description: Po ilu dniach automatycznie usuwać stare wpisy.
      max_entries:
        name: Maksymalna liczba wpisów
        description: Górny limit liczby zachowanych zdarzeń audytowych.
      privacy:
        name: Poziom prywatności
        description: Zapisuj pełne dane, dane zamaskowane albo wyłącznie metadane.
  recipients:
    name: Odbiorcy zapisani
    description: Zdefiniuj nazwanych odbiorców do SMS-ów i połączeń.
    fields:
      id:
        name: ID odbiorcy
        description: Opcjonalny stały identyfikator używany przez REST i MQTT.
      name:
        name: Nazwa odbiorcy
        description: Nazwa wyświetlana odbiorcy.
      phone:
        name: Numer telefonu
        description: Międzynarodowy numer telefonu.
network:
  8099/TCP: Q-Tronic SMS Gateway web UI i REST API
